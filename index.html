<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 11 - Responsive CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">Header Section</header>
        
        <aside class="sidebar">Sidebar (Navigation)</aside>
        
        <main class="main-content">
            <h1>Main Content Area</h1>
            <p>This layout uses CSS Grid to manage sections efficiently across all screen sizes.</p>
            <div class="card-container">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
            </div>
        </main>
        
        <footer class="footer">Footer Section - 2024</footer>
    </div>
</body>
</html>
